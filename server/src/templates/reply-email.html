<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f7f7f1;font-family:Arial,Helvetica,sans-serif;color:#20372b;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;">
    <div style="background:#174b37;color:#ffffff;padding:20px 26px;">
      <h1 style="margin:0;font-size:22px;">Nabta</h1>
      <p style="margin:6px 0 0;color:#d1e17e;">We replied to your message</p>
    </div>
    <div style="padding:24px 26px;">
      <p>Hello {{name}},</p>
      <p style="white-space:pre-line;border-left:3px solid #d1e17e;padding-left:12px;">{{reply}}</p>
      <p style="color:#7a877a;font-size:13px;margin-top:20px;">{{authorName}} &middot; Nabta team</p>
      <hr style="border:0;border-top:1px solid #e3e7dd;margin:20px 0;">
      <p style="color:#7a877a;font-size:13px;margin:0;">Your message &ldquo;{{subject}}&rdquo;:</p>
      <p style="color:#7a877a;font-size:13px;white-space:pre-line;">{{original}}</p>
    </div>
  </div>
</body>
</html>
