<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<body style="margin:0;padding:24px;background:#faf6ee;font-family:Tahoma,Arial,Helvetica,sans-serif;color:#2b2a22;">
  <div dir="{{dir}}" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;text-align:{{align}};">
    <div style="background:#2f5d2a;color:#ffffff;padding:20px 26px;">
      <h1 style="margin:0;font-size:22px;">{{storeName}}</h1>
      <p style="margin:6px 0 0;color:#f2c46d;">{{headline}}</p>
    </div>
    <div style="padding:24px 26px;">
      <p>{{greeting}}</p>
      <p style="white-space:pre-line;border-{{alignStart}}:3px solid #e3a21a;padding-{{alignStart}}:12px;">{{reply}}</p>
      <p style="color:#857b66;font-size:13px;margin-top:20px;">{{authorName}} &middot; {{teamLabel}}</p>
      <hr style="border:0;border-top:1px solid #ece4d4;margin:20px 0;">
      <p style="color:#857b66;font-size:13px;margin:0;">{{yourMessageLabel}} &ldquo;{{subject}}&rdquo;:</p>
      <p style="color:#857b66;font-size:13px;white-space:pre-line;">{{original}}</p>
    </div>
  </div>
</body>
</html>
