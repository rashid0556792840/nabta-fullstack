<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<body style="margin:0;padding:24px;background:#faf6ee;font-family:Tahoma,Arial,Helvetica,sans-serif;color:#2b2a22;">
  <table role="presentation" width="100%" dir="{{dir}}" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;">
    <tr>
      <td style="background:#2f5d2a;color:#ffffff;padding:22px 26px;">
        <h1 style="margin:0;font-size:22px;">{{storeName}}</h1>
        <p style="margin:6px 0 0;color:#f2c46d;">{{headline}}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 26px;text-align:{{align}};">
        <p>{{greeting}}</p>
        <p>{{message}}</p>
        <p style="margin:18px 0 6px;"><strong>{{orderLabel}} {{orderNumber}}</strong> &middot; {{statusLabel}}: <strong>{{status}}</strong></p>
        <table role="presentation" width="100%" style="border-collapse:collapse;font-size:14px;">
          {{itemsHtml}}
          <tr><td style="padding:10px 0 0;border-top:1px solid #ece4d4;"><strong>{{totalLabel}}</strong></td>
              <td style="padding:10px 0 0;border-top:1px solid #ece4d4;text-align:{{alignEnd}};"><strong>{{total}}</strong></td></tr>
        </table>
        <p style="margin-top:20px;color:#857b66;font-size:13px;">{{footer}}</p>
      </td>
    </tr>
  </table>
</body>
</html>
