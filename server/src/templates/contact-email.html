<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f7f7f1;font-family:Arial,Helvetica,sans-serif;color:#20372b;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;padding:24px 26px;">
    <h2 style="margin:0 0 12px;color:#174b37;">New contact message</h2>
    <p><strong>From:</strong> {{name}} &lt;{{email}}&gt;</p>
    <p><strong>Subject:</strong> {{subject}}</p>
    <p style="white-space:pre-line;border-left:3px solid #d1e17e;padding-left:12px;">{{message}}</p>
  </div>
</body>
</html>
