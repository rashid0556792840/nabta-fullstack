# Render Blueprint (Unit 6): deploys the backend and the frontend as two services.
# Render dashboard -> New -> Blueprint -> pick this repository. Fill in the values marked "sync: false" when asked.
services:
  # ---------- Backend: Node.js + Express API ----------
  - type: web
    name: nabta-api
    runtime: node
      - type: web
    name: nabta-api
    runtime: node
    region: singapore
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URL # the frontend URL, e.g. https://nabta-web.onrender.com
        sync: false
      - key: ADMIN_NAME
        value: Nabta Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STORE_EMAIL
        sync: false

  # ---------- Frontend: React static site ----------
  - type: web
    name: nabta-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # the backend URL, e.g. https://nabta-api.onrender.com
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
